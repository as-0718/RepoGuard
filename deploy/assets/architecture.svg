<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="RepoGuard 部署架构：nginx、只读 API、webhook 独立进程与本地产物">
  <rect x="0" y="0" width="900" height="540" fill="#f5f7fb"/>

  <text x="30" y="38" font-size="20" font-weight="700" fill="#1a1f2b">RepoGuard 部署架构（只读聚合）</text>

  <rect x="30" y="70" width="180" height="70" rx="10" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="120" y="100" text-anchor="middle" font-size="14" fill="#1a1f2b">维护者 / 浏览器</text>
  <text x="120" y="121" text-anchor="middle" font-size="12" fill="#5b6472">HTTPS 访问看板</text>

  <rect x="270" y="70" width="200" height="70" rx="10" fill="#e8f0fe" stroke="#1f6feb"/>
  <text x="370" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6feb">nginx</text>
  <text x="370" y="121" text-anchor="middle" font-size="12" fill="#1f6feb">静态托管 + /api 反代</text>

  <rect x="540" y="60" width="330" height="90" rx="10" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="705" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1f2b">应用层（单实例）</text>
  <rect x="556" y="98" width="140" height="38" rx="6" fill="#f8fafc" stroke="#dfe4ec"/>
  <text x="626" y="123" text-anchor="middle" font-size="12" fill="#1a1f2b">API 127.0.0.1:8000</text>
  <rect x="712" y="98" width="140" height="38" rx="6" fill="#f8fafc" stroke="#dfe4ec"/>
  <text x="782" y="123" text-anchor="middle" font-size="12" fill="#1a1f2b">webhook 8010</text>

  <rect x="270" y="210" width="600" height="100" rx="10" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="570" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1f2b">数据来源与产物</text>
  <rect x="290" y="254" width="170" height="40" rx="6" fill="#f8fafc" stroke="#dfe4ec"/>
  <text x="375" y="279" text-anchor="middle" font-size="12" fill="#1a1f2b">health 巡检</text>
  <rect x="480" y="254" width="170" height="40" rx="6" fill="#f8fafc" stroke="#dfe4ec"/>
  <text x="565" y="279" text-anchor="middle" font-size="12" fill="#1a1f2b">README 扫描</text>
  <rect x="670" y="254" width="180" height="40" rx="6" fill="#fff8e6" stroke="#f0c36d"/>
  <text x="760" y="279" text-anchor="middle" font-size="12" fill="#8a5a00">artifacts/ 快照产物</text>

  <rect x="270" y="350" width="600" height="120" rx="10" fill="#f8fafc" stroke="#dfe4ec"/>
  <text x="570" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1f2b">调度层（三选一，禁止并发）</text>
  <rect x="292" y="394" width="170" height="52" rx="6" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="377" y="416" text-anchor="middle" font-size="12" fill="#1a1f2b">Linux cron</text>
  <text x="377" y="434" text-anchor="middle" font-size="11" fill="#5b6472">02:00 / 02:05</text>
  <rect x="484" y="394" width="170" height="52" rx="6" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="569" y="416" text-anchor="middle" font-size="12" fill="#1a1f2b">Windows 计划任务</text>
  <text x="569" y="434" text-anchor="middle" font-size="11" fill="#5b6472">IgnoreNew + 15 分钟</text>
  <rect x="676" y="394" width="174" height="52" rx="6" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="763" y="416" text-anchor="middle" font-size="12" fill="#1a1f2b">CodeArts 流水线</text>
  <text x="763" y="434" text-anchor="middle" font-size="11" fill="#5b6472">需先托管代码</text>

  <line x1="210" y1="105" x2="270" y2="105" stroke="#5b6472" stroke-width="2"/>
  <line x1="470" y1="105" x2="540" y2="105" stroke="#5b6472" stroke-width="2"/>
  <line x1="570" y1="150" x2="570" y2="210" stroke="#5b6472" stroke-width="2"/>
  <line x1="570" y1="310" x2="570" y2="350" stroke="#5b6472" stroke-width="2"/>
  <line x1="210" y1="300" x2="270" y2="260" stroke="#dfe4ec" stroke-width="2" stroke-dasharray="4 4"/>

  <text x="30" y="505" font-size="12" fill="#5b6472">单实例部署：缓存位于进程内存，多实例不共享；看板只读，不提供写操作与历史趋势。</text>
</svg>