<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="RepoGuard 部署流程：预检、依赖、构建、投放、托管、校验、冒烟、记录">
  <rect x="0" y="0" width="940" height="300" fill="#f5f7fb"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#1a1f2b">部署流程（默认 dry-run）</text>

  <g font-size="12" fill="#1a1f2b" text-anchor="middle">
    <rect x="26" y="90" width="100" height="76" rx="8" fill="#ffffff" stroke="#dfe4ec"/>
    <text x="76" y="120">1 预检</text>
    <text x="76" y="140" fill="#5b6472">只读</text>

    <rect x="146" y="90" width="100" height="76" rx="8" fill="#ffffff" stroke="#dfe4ec"/>
    <text x="196" y="120">2 后端依赖</text>
    <text x="196" y="140" fill="#5b6472">pip</text>

    <rect x="266" y="90" width="100" height="76" rx="8" fill="#ffffff" stroke="#dfe4ec"/>
    <text x="316" y="120">3 前端构建</text>
    <text x="316" y="140" fill="#5b6472">npm ci/build</text>

    <rect x="386" y="90" width="100" height="76" rx="8" fill="#ffffff" stroke="#dfe4ec"/>
    <text x="436" y="120">4 静态投放</text>
    <text x="436" y="140" fill="#5b6472">dist</text>

    <rect x="506" y="90" width="100" height="76" rx="8" fill="#ffffff" stroke="#dfe4ec"/>
    <text x="556" y="120">5 服务托管</text>
    <text x="556" y="140" fill="#5b6472">systemd</text>

    <rect x="626" y="90" width="100" height="76" rx="8" fill="#ffffff" stroke="#dfe4ec"/>
    <text x="676" y="120">6 nginx</text>
    <text x="676" y="140" fill="#5b6472">-t / reload</text>

    <rect x="746" y="90" width="100" height="76" rx="8" fill="#ffffff" stroke="#dfe4ec"/>
    <text x="796" y="120">7 冒烟</text>
    <text x="796" y="140" fill="#5b6472">3 接口</text>

    <rect x="866" y="90" width="60" height="76" rx="8" fill="#fff8e6" stroke="#f0c36d"/>
    <text x="896" y="120">8/9</text>
    <text x="896" y="140" fill="#8a5a00">记录</text>
  </g>

  <g stroke="#5b6472" stroke-width="2">
    <line x1="126" y1="128" x2="146" y2="128"/>
    <line x1="246" y1="128" x2="266" y2="128"/>
    <line x1="366" y1="128" x2="386" y2="128"/>
    <line x1="486" y1="128" x2="506" y2="128"/>
    <line x1="606" y1="128" x2="626" y2="128"/>
    <line x1="726" y1="128" x2="746" y2="128"/>
    <line x1="846" y1="128" x2="866" y2="128"/>
  </g>

  <text x="30" y="225" font-size="12" fill="#5b6472">工具缺失（docker / nginx / systemd / crontab）记 SKIP，不计入通过项。</text>
  <text x="30" y="249" font-size="12" fill="#5b6472">未执行 docker build、未执行 nginx -t、未执行 hcloud、未上云。</text>
  <text x="30" y="273" font-size="12" fill="#5b6472">生产上线需资源就绪；本地仅做静态校验与本地 API 冒烟。</text>
</svg>