<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="RepoGuard 端口拓扑：80/443 对外，8000/8010 仅回环，5173 仅开发">
  <rect x="0" y="0" width="900" height="470" fill="#f5f7fb"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#1a1f2b">端口与暴露范围</text>

  <rect x="40" y="90" width="170" height="80" rx="10" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="125" y="122" text-anchor="middle" font-size="14" fill="#1a1f2b">公网 / 内网</text>
  <text x="125" y="144" text-anchor="middle" font-size="12" fill="#5b6472">由安全组决定</text>

  <rect x="290" y="70" width="210" height="120" rx="10" fill="#e8f0fe" stroke="#1f6feb"/>
  <text x="395" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6feb">nginx</text>
  <text x="395" y="124" text-anchor="middle" font-size="12" fill="#1f6feb">0.0.0.0:80</text>
  <text x="395" y="146" text-anchor="middle" font-size="12" fill="#1f6feb">0.0.0.0:443</text>
  <text x="395" y="170" text-anchor="middle" font-size="11" fill="#5b6472">静态 + /api 反代</text>

  <rect x="590" y="50" width="260" height="70" rx="10" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="720" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f2b">API 127.0.0.1:8000</text>
  <text x="720" y="100" text-anchor="middle" font-size="11" fill="#c0392b">仅回环，禁止公网映射</text>

  <rect x="590" y="140" width="260" height="70" rx="10" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="720" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f2b">webhook 127.0.0.1:8010</text>
  <text x="720" y="190" text-anchor="middle" font-size="11" fill="#c0392b">仅回环；nginx 默认 404</text>

  <rect x="290" y="300" width="210" height="90" rx="10" fill="#f8fafc" stroke="#dfe4ec" stroke-dasharray="6 4"/>
  <text x="395" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1f2b">Vite dev 127.0.0.1:5173</text>
  <text x="395" y="352" text-anchor="middle" font-size="11" fill="#5b6472">仅开发期</text>
  <text x="395" y="372" text-anchor="middle" font-size="11" fill="#5b6472">/api 代理到 8000</text>

  <line x1="210" y1="130" x2="290" y2="130" stroke="#5b6472" stroke-width="2"/>
  <line x1="500" y1="110" x2="590" y2="85" stroke="#5b6472" stroke-width="2"/>
  <line x1="500" y1="150" x2="590" y2="175" stroke="#5b6472" stroke-width="2"/>

  <text x="40" y="240" font-size="12" fill="#5b6472">对外仅 80/443；8000 与 8010 必须写成 127.0.0.1:端口:端口。</text>
  <text x="40" y="264" font-size="12" fill="#5b6472">compose 中禁止 0.0.0.0:8000、8080:8000、privileged。</text>
  <text x="40" y="288" font-size="12" fill="#5b6472">/webhook 由 nginx return 404，需暴露时单独评审。</text>
</svg>