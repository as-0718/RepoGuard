<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoGuard 界面风格预览 · 深色可切换</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231f6feb'/%3E%3Cpath d='M7 12.5l3.2 3.2L17 9' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #e7ecf3; color: #1a1f2b; line-height: 1.5; padding: 28px 20px 60px;
  }
  .page-head { max-width: 1080px; margin: 0 auto 22px; }
  .page-head h1 { font-size: 22px; margin-bottom: 6px; }
  .page-head p { color: #5b6472; font-size: 13px; }
  .wrap { max-width: 1080px; margin: 0 auto; }

  .mock { border-radius: 20px; overflow: hidden; border: 1px solid rgba(0,0,0,.07); }

  /* 顶栏 */
  .bar { display: flex; align-items: center; gap: 12px; padding: 13px 18px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .brand-mark { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; }
  .nav { display: flex; gap: 3px; }
  .nav span { font-size: 12.5px; padding: 6px 11px; border-radius: 8px; white-space: nowrap; }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .tools select { font: inherit; font-size: 12px; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .btn { font: inherit; font-size: 12.5px; padding: 8px 14px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
  .theme-toggle { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 12.5px; white-space: nowrap; cursor: pointer; flex: none; }
  .theme-toggle svg { color: var(--ink); flex: none; display: block; }
  .theme-toggle span { color: var(--ink); }

  .body { padding: 18px; display: flex; flex-direction: column; gap: 16px; }

  /* Hero */
  .hero { border-radius: 18px; padding: 20px 22px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -40px; top: -50px; width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .hero h2 { font-size: 18px; margin-bottom: 5px; }
  .hero p { font-size: 12.5px; opacity: .92; max-width: 460px; }
  .hero-tags { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .hero-tags span { font-size: 11px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.18); }

  .meta-row { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12px; color: var(--muted); }
  .meta-row strong { color: var(--ink); font-weight: 600; }

  /* KPI */
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
  .kpi { border-radius: 14px; padding: 13px 14px; background: var(--surface); border: 1px solid var(--line); }
  .kpi .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .kpi .icon { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
  .kpi .k-label { font-size: 12px; color: var(--muted); }
  .kpi .k-value { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--ink); }
  .kpi .k-unit { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .kpi.k-high { background: var(--high-soft); }
  .kpi.k-warn { background: var(--warn-soft); }
  .tag { font-size: 10px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .tag-high { color: var(--high); }
  .tag-warn { color: var(--warn); }
  .tag-muted { color: var(--muted); }

  /* 筛选 */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--muted); }
  .field select, .field input { font: inherit; font-size: 12px; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 120px; }
  .field-grow { flex: 1 1 180px; }

  .main-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .main-grid { grid-template-columns: minmax(0,1fr); } }

  .col-main, .col-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .panel h4 { font-size: 13px; margin-bottom: 12px; color: var(--ink); }

  .charts { display: grid; grid-template-columns: 1fr 1.2fr; gap: 14px; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 92px; }
  .bars i { flex: 1; border-radius: 6px 6px 2px 2px; display: block; }
  .ring { width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto; }
  .ring .inner { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; background: var(--surface); color: var(--ink); }
  .legend { display: flex; gap: 14px; justify-content: center; margin-top: 10px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

  /* 表格 */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  thead th { font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  td .file { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--ink); }
  td .desc { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .lvl { font-size: 10.5px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .lvl-high { color: var(--high); background: var(--high-soft); }
  .lvl-warn { color: var(--warn); background: var(--warn-soft); }

  /* 侧栏 */
  .history-item { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
  .history-item:last-child { border-bottom: 0; }
  .history-item .h-time { color: var(--muted); font-size: 11px; }
  .history-item .h-num { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
  .notice-line { display: flex; gap: 8px; font-size: 12px; color: var(--warn); }
  .ftype { margin-bottom: 12px; }
  .ftype:last-child { margin-bottom: 0; }
  .ftype .ft-top { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-bottom: 5px; }
  .ftype .ft-bar { height: 8px; border-radius: 999px; background: var(--bg); overflow: hidden; }
  .ftype .ft-bar i { display: block; height: 100%; border-radius: 999px; }

  /* 浅色主题 */
  .theme-light {
    --bg: #eef3fa; --surface: #ffffff; --ink: #15202e; --muted: #5f6c7d; --line: #e2e9f2;
    --accent: #1f6feb; --accent2: #12b5a5; --high: #e05244; --warn: #dd9a26;
    --high-soft: #fdeeee; --warn-soft: #fdf3e3;
  }
  .theme-light { background: var(--bg); background-image: radial-gradient(600px 300px at 12% -10%, rgba(31,111,235,.10), transparent 60%), radial-gradient(500px 280px at 105% 20%, rgba(18,181,165,.10), transparent 60%); }
  .theme-light .bar { background: rgba(255,255,255,.75); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .theme-light .brand { color: var(--ink); }
  .theme-light .brand-mark { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .theme-light .nav span { color: var(--muted); }
  .theme-light .nav span.on { background: #e8f0fe; color: var(--accent); font-weight: 600; }
  .theme-light .btn-primary { box-shadow: 0 6px 16px rgba(31,111,235,.30); }
  .theme-light .hero { background: linear-gradient(135deg, #1f6feb 0%, #0ea5b7 58%, #12b5a5 100%); color: #fff; box-shadow: 0 12px 28px rgba(31,111,235,.25); }
  .theme-light .icon-1 { background: #e8f0fe; color: var(--accent); }
  .theme-light .icon-2 { background: #eef2ff; color: #6b46c1; }
  .theme-light .icon-3 { background: #fdeeee; color: var(--high); }
  .theme-light .icon-4 { background: #fdf3e3; color: var(--warn); }
  .theme-light .icon-5 { background: #eef2f7; color: var(--muted); }
  .theme-light .bars i:nth-child(1) { height: 62%; background: #1f6feb; }
  .theme-light .bars i:nth-child(2) { height: 88%; background: #1f6feb; }
  .theme-light .bars i:nth-child(3) { height: 45%; background: #12b5a5; }
  .theme-light .bars i:nth-child(4) { height: 70%; background: #12b5a5; }
  .theme-light .ring { background: conic-gradient(#e05244 0 52%, #dd9a26 52% 100%); }

  /* 深色主题（默认） */
  .theme-dark {
    --bg: #0d1622; --surface: #16243a; --ink: #e8eef6; --muted: #93a3b8; --line: #26374f;
    --accent: #3b82f6; --accent2: #22d3ee; --high: #f0655a; --warn: #eab308;
    --high-soft: rgba(240,101,90,.16); --warn-soft: rgba(234,179,8,.16);
  }
  .theme-dark { background: var(--bg); background-image: radial-gradient(600px 300px at 100% -10%, rgba(34,211,238,.12), transparent 60%); }
  .theme-dark .bar { background: rgba(13,22,34,.8); border-bottom: 1px solid var(--line); }
  .theme-dark .brand { color: var(--ink); }
  .theme-dark .brand-mark { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .theme-dark .nav span { color: var(--muted); }
  .theme-dark .nav span.on { background: rgba(59,130,246,.18); color: #dbeafe; font-weight: 600; }
  .theme-dark .btn-primary { color: #08131f; font-weight: 600; box-shadow: 0 6px 18px rgba(34,211,238,.25); }
  .theme-dark .btn-ghost { color: var(--ink); }
  .theme-dark .hero { background: linear-gradient(135deg, #1e3a8a 0%, #0e7490 100%); color: #fff; border: 1px solid rgba(255,255,255,.08); }
  .theme-dark .icon-1 { background: rgba(59,130,246,.18); color: #93c5fd; }
  .theme-dark .icon-2 { background: rgba(139,92,246,.18); color: #c4b5fd; }
  .theme-dark .icon-3 { background: rgba(240,101,90,.18); color: #fca5a5; }
  .theme-dark .icon-4 { background: rgba(234,179,8,.18); color: #fcd34d; }
  .theme-dark .icon-5 { background: rgba(147,163,184,.18); color: var(--muted); }
  .theme-dark .bars i:nth-child(1) { height: 62%; background: #3b82f6; }
  .theme-dark .bars i:nth-child(2) { height: 88%; background: #3b82f6; }
  .theme-dark .bars i:nth-child(3) { height: 45%; background: #22d3ee; }
  .theme-dark .bars i:nth-child(4) { height: 70%; background: #22d3ee; }
  .theme-dark .ring { background: conic-gradient(#f0655a 0 52%, #eab308 52% 100%); }

  .foot-note { max-width: 1080px; margin: 22px auto 0; font-size: 12px; color: #5b6472; }
</style>
</head>
<body>
  <div class="page-head">
    <h1>RepoGuard 风格预览 · 深色默认，可一键互换浅色</h1>
    <p>默认采用深色仪表盘；点顶栏右侧的月亮/太阳按钮即可在深色与浅色之间互换。示例数据为内置 demo-repo：8 个文件、21 个问题（高风险 11 / 建议 10）。</p>
  </div>

  <div class="wrap">
    <div class="mock theme-dark" id="mock"></div>
  </div>

  <p class="foot-note">说明：预览为静态原型，表格与历史记录为示例数据；定稿后会把两套 CSS 变量、切换按钮与主题记忆（localStorage）落到真实工程，ECharts 配色同步跟随主题。</p>

<script>
const ICONS = {
  file: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 3h9l4 4v14H6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5" stroke="currentColor" stroke-width="1.8"/></svg>',
  list: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  triangle: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3L2.5 20h19L12 3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4M12 17h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  bulb: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.8.6 1.5 1.4 1.5 2.1h4c0-.7.7-1.5 1.5-2.1A6 6 0 0012 3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  ghost: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 21V8l7-5 7 5v13" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 21v-6h6v6" stroke="currentColor" stroke-width="1.8"/></svg>',
  help: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9.5a2.5 2.5 0 015 .2c0 1.7-2.5 2-2.5 3.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 17h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  skip: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 5l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>',
  clock: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
};

const MOON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
const SUN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

const KPI = [
  { label: '文件数', value: 8, icon: 'file', ic: 1 },
  { label: '问题总数', value: 21, icon: 'list', ic: 2 },
  { label: '高风险', value: 11, icon: 'triangle', ic: 3, tone: 'high', tag: '高风险' },
  { label: '建议', value: 10, icon: 'bulb', ic: 4, tone: 'warn', tag: '建议' },
  { label: '僵尸候选', value: 0, icon: 'ghost', ic: 5 },
  { label: '无法判定', value: 8, icon: 'help', ic: 5, tag: '未启用' },
  { label: '降级项', value: 1, icon: 'help', ic: 5, tag: '未启用' },
  { label: '跳过文件', value: 0, icon: 'skip', ic: 5, tag: '未启用' },
  { label: '扫描耗时', value: 51, unit: 'ms', icon: 'clock', ic: 1 }
];

const ROWS = [
  { file: 'config/settings.py', rule: '敏感信息', lvl: 'high', pos: 'L8', desc: '疑似硬编码本地绝对路径，建议改为环境变量' },
  { file: 'scripts/build.ps1', rule: '大文件', lvl: 'high', pos: '脚本', desc: '产物体积偏大，建议拆分或清理中间产物' },
  { file: 'src/utils/helper.js', rule: '命名与目录', lvl: 'warn', pos: 'L12', desc: '函数名混用驼峰与下划线，建议统一命名风格' },
  { file: 'docs/api.md', rule: '链接有效性', lvl: 'warn', pos: '第 3 节', desc: '内部链接指向缺失文件，建议补齐或修正路径' },
  { file: 'README.md', rule: '文档结构', lvl: 'warn', pos: '全文', desc: '缺少安装与运行说明段落，建议补充快速上手' },
  { file: 'src/legacy/old_module.py', rule: '命名与目录', lvl: 'warn', pos: '模块', desc: '疑似未被引用的僵尸候选模块，建议确认后清理' }
];

const HISTORY = [
  { time: '2026-11-17 15:10', issues: 21, high: 11, ms: 51, cur: true },
  { time: '2026-11-16 20:42', issues: 19, high: 10, ms: 48 },
  { time: '2026-11-16 11:05', issues: 23, high: 12, ms: 60 }
];

const FILETYPES = [
  { name: '代码', count: 5, pct: 62, color: 'var(--accent)' },
  { name: '文档', count: 2, pct: 25, color: '#12b5a5' },
  { name: '其他', count: 1, pct: 13, color: 'var(--muted)' }
];

function kpiCard(k) {
  const tone = k.tone === 'high' ? 'k-high' : k.tone === 'warn' ? 'k-warn' : '';
  const tag = k.tag ? `<span class="tag ${k.tone === 'high' ? 'tag-high' : k.tone === 'warn' ? 'tag-warn' : 'tag-muted'}">${k.tag}</span>` : '';
  return `<div class="kpi ${tone}">
    <div class="top"><span class="icon icon-${k.ic}">${ICONS[k.icon]}</span>${tag}</div>
    <div class="k-label">${k.label}</div>
    <div class="k-value">${k.value}${k.unit ? `<span class="k-unit">${k.unit}</span>` : ''}</div>
  </div>`;
}

function rowHtml(r) {
  const lvlCls = r.lvl === 'high' ? 'lvl-high' : 'lvl-warn';
  const lvlText = r.lvl === 'high' ? '高风险' : '建议';
  return `<tr>
    <td><span class="file">${r.file}</span><div class="desc">${r.desc}</div></td>
    <td>${r.rule}</td>
    <td><span class="lvl ${lvlCls}">${lvlText}</span></td>
    <td>${r.pos}</td>
  </tr>`;
}

function render(el) {
  el.innerHTML = `
  <div class="bar">
    <span class="brand"><span class="brand-mark">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.4-3 7.7-7 9-4-1.3-7-4.6-7-9V6l7-3z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </span>RepoGuard</span>
    <nav class="nav"><span class="on">总览</span><span>问题明细</span><span>结构/README</span><span>历史记录</span><span>关于/健康</span></nav>
    <div class="tools">
      <button class="theme-toggle" id="themeToggle"></button>
      <select><option>demo-repo</option></select>
      <button class="btn btn-ghost">更换仓库</button>
      <button class="btn btn-primary">刷新</button>
    </div>
  </div>
  <div class="body">
    <div class="hero">
      <h2>代码巡检总览</h2>
      <p>本地只读静态分析：命名与目录、代码规范、链接有效性、敏感信息与大文件、文档结构一次性扫描。</p>
      <div class="hero-tags"><span>本地运行 · 不上传</span><span>只读巡检</span><span>规则引擎</span></div>
    </div>
    <div class="meta-row">
      <span>扫描时间 <strong>2026-11-17 15:10</strong></span>
      <span>缓存命中 <strong>否</strong></span>
      <span>缓存年龄 <strong>0 秒</strong></span>
      <span>刷新节流 <strong>否</strong></span>
    </div>
    <div class="kpis">${KPI.map(kpiCard).join('')}</div>
    <div class="filter-bar">
      <div class="field"><label>风险等级</label><select><option>全部</option><option>高风险</option><option>建议</option></select></div>
      <div class="field"><label>来源模块</label><select><option>全部</option><option>命名与目录</option><option>代码规范</option><option>链接检查</option></select></div>
      <div class="field field-grow"><label>关键词</label><input placeholder="搜索文件路径或规则…" /></div>
      <button class="btn btn-primary">查询</button>
    </div>
    <div class="main-grid">
      <div class="col-main">
        <div class="charts">
          <div class="panel">
            <h4>风险构成</h4>
            <div class="ring"><div class="inner">21</div></div>
            <div class="legend"><span><i style="background:#e05244"></i>高风险 11</span><span><i style="background:#dd9a26"></i>建议 10</span></div>
          </div>
          <div class="panel">
            <h4>来源模块分布</h4>
            <div class="bars"><i></i><i></i><i></i><i></i></div>
            <div class="legend"><span>命名目录</span><span>代码规范</span><span>链接检查</span><span>敏感信息</span></div>
          </div>
        </div>
        <div class="panel table-wrap">
          <h4>问题明细（示例 6 条）</h4>
          <table>
            <colgroup><col style="width:34%"><col style="width:20%"><col style="width:16%"><col style="width:14%"></colgroup>
            <thead><tr><th>文件 / 摘要</th><th>规则</th><th>级别</th><th>位置</th></tr></thead>
            <tbody>${ROWS.map(rowHtml).join('')}</tbody>
          </table>
        </div>
      </div>
      <div class="col-side">
        <div class="panel">
          <h4>历史快照</h4>
          ${HISTORY.map(h => `<div class="history-item">
            <div><div class="h-time">${h.time}</div><div class="h-num">${h.issues} 问题 · 高 ${h.high}</div></div>
            <div class="h-time">${h.ms}ms</div>
          </div>`).join('')}
        </div>
        <div class="panel">
          <h4>降级与警告</h4>
          <div class="notice-line"><span>•</span><span>本次巡检部分降级，个别文件未能解析，数据可能不完整。</span></div>
        </div>
        <div class="panel">
          <h4>文件类型分布</h4>
          ${FILETYPES.map(f => `<div class="ftype">
            <div class="ft-top"><span>${f.name}</span><span>${f.count} 个</span></div>
            <div class="ft-bar"><i style="width:${f.pct}%;background:${f.color}"></i></div>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

const mock = document.getElementById('mock');
render(mock);
const toggle = document.getElementById('themeToggle');

function apply(theme) {
  const dark = theme === 'dark';
  mock.classList.toggle('theme-dark', dark);
  mock.classList.toggle('theme-light', !dark);
  toggle.innerHTML = dark ? `${MOON}<span>切浅色</span>` : `${SUN}<span>切深色</span>`;
}
apply('dark');
toggle.addEventListener('click', () => {
  apply(mock.classList.contains('theme-dark') ? 'light' : 'dark');
});
</script>
</body>
</html>
